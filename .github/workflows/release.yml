name: canary-release

# Tag-driven release. Today the shipped tarball is built by hand from a local
# checkout (`npm run build` + `node tooling/pack.mjs`) and uploaded manually,
# which is how the published asset drifted one commit behind main. This workflow
# makes the artifact reproducible from the tag alone, publishes it with a
# verifiable build provenance attestation, and (when an npm token is configured)
# publishes the same bytes to the registry.
#
# Division of labour: VERIFICATION is canary-ci's job, and canary-ci already runs
# on tag pushes. This workflow does not re-run the unit suite, so a tag cut from
# an unverified tree can still be packaged â€” that residual is stated rather than
# hidden. In practice: confirm canary-ci is green for the tagged commit first.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, hash and attest, but do not create/update the GitHub release or publish'
        type: boolean
        default: true

permissions:
  contents: write       # create/update the release and upload assets
  id-token: write       # OIDC: build-provenance attestation + npm provenance
  attestations: write

jobs:
  release:
    name: pack, attest, release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Secrets may NOT be referenced directly inside an `if:` expression.
    # GitHub rejects that, and the workflow then registers as a failed run
    # with zero jobs ("No jobs were run"). The supported pattern is to
    # expose the secret as job-level env and test the env value instead.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # needed for the ancestry check below

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Tag, root manifest and CLI manifest must agree
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          ROOT="$(node -p "require('./package.json').version")"
          CLI="$(node -p "require('./apps/cli/package.json').version")"
          echo "tag=$TAG root=$ROOT cli=$CLI"
          if [ "$TAG" != "$CLI" ]; then
            echo "FAIL: tag $GITHUB_REF_NAME does not match apps/cli/package.json version $CLI"
            echo "The packed tarball takes its version from the CLI manifest (tooling/pack.mjs)."
            exit 1
          fi
          if [ "$ROOT" != "$CLI" ]; then
            echo "FAIL: root package.json ($ROOT) and apps/cli/package.json ($CLI) disagree."
            echo "Source libraries are internal and versioned separately; the shipped CLI and the"
            echo "root manifest are the public identity and must not drift."
            exit 1
          fi

      - name: Tagged commit must be on main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "OK: $GITHUB_SHA is an ancestor of main"

      - run: npm ci --no-audit --no-fund
      - run: npm run build

      - name: Pack the distributable bundle
        run: node tooling/pack.mjs

      - name: Checksum the artifact
        run: |
          set -euo pipefail
          cd pack/npm
          ls -l
          sha256sum ./*.tgz > "$(basename "$(ls ./*.tgz)").sha256"
          cat ./*.sha256

      # Provenance for the exact bytes being published, verifiable with
      #   gh attestation verify <tgz> --repo criptofn/Canary
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pack/npm/*.tgz

      - name: Publish the GitHub release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # MEASURED (v1.4.0): creating the release AND uploading its assets in one
          # `gh release create <tag> <assets...>` call failed twice with
          # `HTTP 422: Validation Failed (uploads.github.com...)`, leaving a
          # PUBLISHED release with ZERO assets while the job reported the failure.
          # The two operations are now separate and explicit.
          #
          # MEASURED (v1.5 pre-flight, 2026-09-24): the split below then shipped
          # v1.4.0 as a DRAFT. `gh release view <tag>` SUCCEEDS on a draft, so the
          # `|| gh release create` guard treated a pre-existing draft as "already
          # created", skipped the create, uploaded assets into the draft and
          # reported success — while the release stayed invisible to anonymous
          # readers (`releases/tag/v1.4.0` returned 404 and `releases/latest` still
          # resolved to v1.3.0). The step now (a) reads the draft flag explicitly,
          # (b) publishes a draft instead of silently accepting it, and (c) asserts
          # the END STATE — published, not draft, with both assets — so "the job is
          # green" can no longer mean "the release is invisible".
          STATE="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)"
          case "$STATE" in
            absent)
              gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
              ;;
            true)
              echo "NOTE: a DRAFT release already exists for $GITHUB_REF_NAME; publishing it — this workflow's contract is a PUBLISHED release."
              gh release edit "$GITHUB_REF_NAME" --draft=false
              ;;
            false)
              echo "release $GITHUB_REF_NAME is already published; uploading assets into it"
              ;;
            *)
              echo "FAIL: could not determine the release state for $GITHUB_REF_NAME (got '$STATE')"
              exit 1
              ;;
          esac
          gh release upload "$GITHUB_REF_NAME" pack/npm/*.tgz pack/npm/*.tgz.sha256 --clobber
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets --jq '.assets[] | "\(.name) \(.size) bytes"'
          DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
          COUNT="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length')"
          if [ "$DRAFT" != "false" ]; then
            echo "FAIL: release $GITHUB_REF_NAME is still a DRAFT (isDraft=$DRAFT) and is therefore invisible to anonymous readers"
            exit 1
          fi
          if [ "$COUNT" -lt 2 ]; then echo "FAIL: expected tarball + checksum, found $COUNT asset(s)"; exit 1; fi
          echo "OK: $GITHUB_REF_NAME is PUBLISHED (not draft) with $COUNT assets"

      # Registry publishing is optional and fails closed on its own precondition:
      # it needs a repository secret NPM_TOKEN whose account owns the npm scope
      # used by tooling/pack.mjs (@canary-rn). If that scope does not exist on
      # npm, publishing fails with an authorization error â€” pick the final
      # package name there and in tooling/pack.mjs before enabling this.
      # --provenance is what binds the published bytes to this workflow run.
      - name: Publish to npm (only when NPM_TOKEN is configured)
        if: ${{ github.event_name == 'push' && env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: npm publish ./pack/npm/*.tgz --provenance --access public
