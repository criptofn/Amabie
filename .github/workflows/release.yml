name: amabie-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify and prepare artifacts only; publication requires a version tag and environment approval'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: amabie-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # This local reusable workflow verifies the caller's exact revision.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: validate revision and prepare verified package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate version, publication ref and approval configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$(node -p "require('./package.json').version")"
          CLI="$(node -p "require('./apps/cli/package.json').version")"
          test "$ROOT" = "$CLI" || { echo "FAIL: root/CLI versions disagree"; exit 1; }
          if [ "$PUBLISH" = "true" ]; then
            test "$GITHUB_REF_TYPE" = "tag" || { echo "FAIL: publication requires selecting the v$CLI tag, never a branch"; exit 1; }
            test "$GITHUB_REF_NAME" = "v$CLI" || { echo "FAIL: tag $GITHUB_REF_NAME must equal v$CLI"; exit 1; }
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            REVIEWERS="$(gh api "repos/$GITHUB_REPOSITORY/environments/amabie-release" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')"
            test "$REVIEWERS" -gt 0 || { echo "FAIL: configure required reviewers on amabie-release before publication"; exit 1; }
          else
            echo "DRY RUN: branch builds allowed; no public release, attestation or npm publication."
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run build:force
      - run: node tooling/probes/cleanroom-packed-artifact.mjs
      - name: Hash the exact tested artifact
        run: |
          set -euo pipefail
          cd pack/npm
          test "$(find . -maxdepth 1 -name '*.tgz' | wc -l)" -eq 1
          ARTIFACT="$(basename "$(find . -maxdepth 1 -name '*.tgz')")"
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          sha256sum --check "$ARTIFACT.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: pack/npm/*
          if-no-files-found: error

  publish:
    name: publish approved verified bytes
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    needs: [verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: amabie-release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # npm's trusted publisher is scoped to this repository, release.yml and
      # amabie-release. npm >=11.5.1 exchanges the job's OIDC identity itself.
      - name: Install the OIDC-capable npm CLI
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: pack/npm
      - name: Verify approved bytes and revision
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./apps/cli/package.json').version")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd pack/npm
          sha256sum --check ./*.sha256
      - name: Attest the approved artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: pack/npm/*.tgz
      # A real publish verifies OIDC access; `npm whoami` does not. If npm
      # refuses publication, the GitHub release must remain a draft.
      - name: Publish the same bytes to npm with the protected OIDC identity
        run: npm publish ./pack/npm/*.tgz --provenance --access public
      - name: Stage release assets, then publish the complete release
        run: |
          set -euo pipefail
          STATE="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)"
          if [ "$STATE" = "absent" ]; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          elif [ "$STATE" != "true" ] && [ "$STATE" != "false" ]; then
            echo "FAIL: cannot determine release state"; exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" pack/npm/*.tgz pack/npm/*.tgz.sha256 --clobber
          ARTIFACT="$(basename "$(find pack/npm -maxdepth 1 -name '*.tgz')")"
          ASSETS="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          grep -Fx "$ARTIFACT" <<< "$ASSETS"
          grep -Fx "$ARTIFACT.sha256" <<< "$ASSETS"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
