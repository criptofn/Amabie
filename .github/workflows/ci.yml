name: amabie-ci

on:
  push:
    branches: [main]
    # Version tags run these same jobs through release.yml's workflow_call;
    # triggering CI here too would run the complete matrix twice per release.
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: the golden proof must keep holding
  # OPERATIONAL PLUMBING, not a v1.5 product feature. Feature-branch pushes trigger
  # nothing here (see the three triggers above), so verifying one previously required
  # opening a pull request — which is the only reason draft PR #8 existed. This adds a
  # manual trigger; it does NOT change push, pull_request or schedule semantics, and
  # concurrency below still cancels only superseded pull_request runs.
  #
  # NOT USABLE FROM THIS BRANCH YET, and that is stated as an EXPECTATION, not a
  # measurement: GitHub builds the set of dispatchable workflows from the DEFAULT
  # branch, so a manual dispatch of `amabie-ci` is expected to become available only
  # once this file reaches `main`. Nothing in this pass pushes or merges, so the
  # behaviour was NOT verified here and PR #8 remains the way to run CI on this branch.
  workflow_dispatch:
  workflow_call:

# Superseded pull-request runs are wasted work; main/tag runs are never cancelled.
concurrency:
  group: amabie-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: build + unit/integration tests (offline)
    strategy:
      # Both OS legs must report. With the default (fail-fast: true) an Ubuntu
      # failure CANCELS the Windows leg, so a Windows-only break was invisible
      # in exactly the runs where it mattered.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # MEASURED (v1.4 release gate). These are not the same job on the two hosts,
    # so they do not get the same budget.
    #
    # Ubuntu: the whole suite finishes in ~80 s.
    #
    # Windows (GitHub-hosted runner): this leg was red or `cancelled` for two
    # releases. v1.4 ran it down to two INDEPENDENT PRODUCT DEFECTS, not a host
    # limitation — the previous comment here claimed a "stall" and that was
    # wrong:
    #
    #   1. The post-exit containment sweep (packages/support) issued one WMI
    #      query PER PROCESS in the descendant BFS. A fixture command that
    #      spawns a whole test suite has a large tree, so the sweep made 30+
    #      `Get-CimInstance` calls; at the ~1s/query a loaded hosted runner
    #      gives, it exceeded its budget and reported the LOOK as unconfirmable.
    #      Every round of every pipeline then became "not a valid test run" ->
    #      INFRASTRUCTURE_FAILURE, which is 27 of the 29 real failures in run
    #      35636516908, each costing ~334 s of sweeps. Fixed: ONE snapshot.
    #   2. verifyArtifacts (apps/cli/src/prove.ts) resolved a path before
    #      checking it existed, so a DELETED artifact was reported as
    #      "resolves outside the artifacts directory" whenever the host's temp
    #      path has an 8.3 short name (`C:\Users\RUNNER~1\...`). Fixed:
    #      existence first, then canonical containment.
    #
    # The budgets below are measured need plus headroom, so the leg RUNS TO
    # COMPLETION and reports a named verdict instead of an ambiguous
    # `cancelled`. Nothing is skipped and no assertion is relaxed.
    #
    # MEASURED (run 35695885086, after the two product fixes above): the leg's
    # real failures went to ZERO (`testCodeFailure: 0`, 554 tests ok) — but the
    # hosted runner is genuinely slow enough that the suite did not finish: it
    # completed 643 of ~1345 tests in 180 minutes, its slowest suites taking
    # 1955 s / 1377 s / 1305 s / 1279 s where the same suites take seconds here.
    # The budget is therefore 300 minutes: finite (the platform caps a job at
    # 360), above the measured need for the half that DID run, and — with the
    # scanner exclusion above — intended to be TIGHTENED to a measured value
    # once a run completes and reports its real total. No work is dropped to fit
    # it and no assertion is relaxed.
    #
    # One host-bound exception remains and is NOT hidden by this budget: the
    # native confinement suite (confined-activation) needs a host that can
    # EXECUTE inside an AppContainer + restricted token + low integrity, and the
    # GitHub-hosted Windows image measurably refuses that (`spawnSync
    # C:\Program Files\Git\cmd\git.exe EPERM`). It is measured in the job and
    # reports a named host-bound SKIP — never a PASS — and runs in full on any
    # host that can.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 300 || 30 }}
    steps:
      # Actions are pinned by commit SHA (supply chain). Dependabot
      # (.github/dependabot.yml) is what keeps these pins current — do not
      # hand-edit a SHA to a tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # MEASURED (v1.4): on this runner a single pipeline test costs ~334-348 s
      # against ~6-9 s for the same test on a developer Windows machine, and the
      # whole suite needed >180 minutes (run 35695885086: 643 of ~1345 tests,
      # then ~1 test per 3.5 minutes). That profile — uniformly, massively slower
      # process creation and file I/O, with the assertions themselves correct —
      # is what real-time scanning of every spawned process looks like. This is a
      # PERFORMANCE intervention only: no test is skipped, no assertion, timeout
      # or threshold is touched, and the step is best-effort (a policy that
      # refuses the exclusion leaves the job exactly as it was).
      - name: reduce host scanning overhead (performance only, Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction Stop
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction Stop
            Add-MpPreference -ExclusionPath (Join-Path $env:USERPROFILE 'AppData\Local\Temp') -ErrorAction Stop
            Write-Output "exclusions now: $((Get-MpPreference).ExclusionPath -join '; ')"
          } catch {
            Write-Output "::warning::could not set scanner exclusions ($($_.Exception.Message)) — continuing unchanged"
          }
      - run: npm ci --no-audit --no-fund   # audit S3: reproducible, lockfile-exact install
      - name: provision the verified workspace-local Go fixture toolchain
        run: node tooling/toolchains.mjs go --go-version=1.27.2
      - name: provision pytest for the required runner-authority suites
        shell: bash
        run: |
          python -m venv _toolchains/py
          if [ "$RUNNER_OS" = "Windows" ]; then
            _toolchains/py/Scripts/python.exe -m pip install pytest==9.1.1
          else
            _toolchains/py/bin/python -m pip install pytest==9.1.1
          fi
      - run: npm run build
      # Hosted Windows PowerShell 5.1 timed out on real CIM sweeps in run
      # 39964104115. Select the runner's existing Core host explicitly, then
      # prove it can measure processes and clean up owned descendants. A failed
      # prerequisite stops CI; no assertion, sweep budget or fallback is relaxed.
      # Trust the runner image's current tool path; this is not a signature check.
      # Sequential preflight is diagnostic; the full suite still uses concurrency 8.
      - name: verify the selected PowerShell 7 containment host (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskPowerShellHost = (Get-Process -Id $PID).Path
          $env:AMABIE_POWERSHELL_CORE_PATH = $taskPowerShellHost
          node tooling/probes/windows-selected-host.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-concurrency=1 packages/support/dist/test/lifecycle.test.js apps/cli/dist/test/everyday-lifecycle.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "AMABIE_POWERSHELL_CORE_PATH=$taskPowerShellHost"
      # v1.4 — MEASURE THE HOST, THEN ASK THE SUITE FOR THE CAPABILITY.
      #
      # `apps/cli/test/confined-activation.test.ts` requires a host that can
      # EXECUTE a program inside the native confinement (AppContainer +
      # restricted token + low integrity). MEASURED on the GitHub-hosted Windows
      # image (run 35695885086): every confined exec probe reports
      # `spawnSync C:\Program Files\Git\cmd\git.exe EPERM`, 15 of the fixture's 33
      # production-authority controls fail, and this file's `before` hook can only
      # FAIL — never skip — so it produced five hookFailed suites and ~61
      # cancelled tests for a reason unrelated to the change under test. The
      # product was right (it reports NOT HARDENED, fail-closed); the suite was
      # asking the host for something it does not have.
      #
      # So the host is MEASURED here, by the same fixture that performs the real
      # enrollment, and the verdict travels to the suite in these variables. Only
      # a measured refusal to execute (exit 3, raw OS error in the reason) sets
      # them; exit 1 — a failure for any other reason — sets nothing, and the
      # suite then runs and fails on its own merits. A SKIP is never a PASS: the
      # suite is skipped, node:test reports the count, and the reason names the
      # measurement.
      - name: can this host execute inside the native confinement? (measured, Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node tooling/probes/v12-production-authority.mjs --capability *>&1 | Tee-Object -FilePath confined-capability.log
          $code = $LASTEXITCODE
          Write-Output "confinement capability probe exit: $code"
          if ($code -eq 3) {
            $reason = (Select-String -Path confined-capability.log -Pattern '^CAPABILITY: ' | Select-Object -Last 1).Line
            if (-not $reason) { $reason = 'CAPABILITY: this host cannot execute inside the native confinement (probe exit 3)' }
            Add-Content -Path $env:GITHUB_ENV -Value "AMABIE_CONFINED_HOST=unmeasurable"
            Add-Content -Path $env:GITHUB_ENV -Value "AMABIE_CONFINED_HOST_REASON=$reason"
            Write-Output "::notice::$reason"
          } elseif ($code -eq 1) {
            Write-Output "::warning::the confinement capability probe was INCONCLUSIVE (exit 1) — nothing is skipped; the suite runs and must pass or fail on its own merits"
          }
          exit 0

      # Use the same forced rebuild, bounded concurrency and complete glob as local verification.
      - run: npm test
        # Temporary Windows diagnosis only; no process exemptions or retries.
        env:
          AMABIE_TRACE_WINDOWS_SWEEP: ${{ runner.os == 'Windows' && '1' || '0' }}
      - run: node tooling/probes/architecture-closure.mjs
      - run: node tooling/probes/architecture-metrics.mjs
      - run: node tooling/probes/cleanroom-packed-artifact.mjs
      - run: node tooling/probes/packed-architecture.mjs
      - if: runner.os == 'Linux'
        run: node tooling/probes/architecture-closure-mutations.mjs

  real-project:
    name: real external project (Express, pinned) through the regression gate
    # The false proof this guards against needed a REAL dependency tree: a baseline checkout has no
    # git-ignored node_modules, so `npm test` failed with `mocha: not found` and that failure was
    # counted as the checks catching the change. Hand-built fixtures cannot show it. Bounded: one pinned
    # commit, one clone, one `npm install --ignore-scripts`, 10 minutes per command inside the probe.
    # Independent of `core` so a core failure cannot skip it. An unavailable clone or install is a named
    # SKIP (exit 3) that fails this job: a proof that did not run is not a pass.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Express 1c6f1b0 — ignored changes are NOT PROVEN, a genuine one proves
        run: node tooling/probes/express-real-project.mjs

  standalone:
    name: standalone single executable (build AND execute, per host)
    # A single-executable build embeds the RUNNING node binary, so each target
    # must be built and executed on its own host — there is no cross-build. This
    # job is the real build path for linux-x64, darwin-arm64 and win32-x64, and
    # the builder refuses to report success without EXECUTING the artifact with
    # every Node directory removed from PATH.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # MEASURED (v1.4): this job pinned `22` and failed on all three legs for
          # two releases with `FAIL: node --build-sea failed (status 9)` and no
          # other detail. `--build-sea` is documented as "Added in: v25.5.0"
          # (nodejs.org/api/single-executable-applications.html, History table);
          # on Node 22 node rejects the unknown option, prints nothing and exits 9.
          # So the job was asking an incapable runtime to produce the artifact and
          # then reporting the artifact as broken. 26.3.0 is the version this
          # workflow's golden-proof job already runs.
          node-version: 26.3.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: build + EXECUTE the standalone (refuses to claim an unexecuted artifact)
        run: npm run standalone
      - name: the target list is honest about what this host can produce
        run: node tooling/standalone.mjs --list-targets
      - name: upload the executable and its evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-${{ matrix.os }}
          path: |
            pack/standalone/**
          if-no-files-found: warn

  golden-proof:
    name: golden regression proof (axios 0.27.2 -> 1.0.0) — DESIGNATED PROOF HOST
    # Deliberately INDEPENDENT of `core`. This job is the committed proof host and
    # the flagship evidence claim; while it was gated behind the matrix it
    # returned `skipped` on every run whose Ubuntu leg failed — i.e. the proof
    # went unexecuted while the workflow still reported a verdict. A proof that
    # can be silently skipped is not a proof. It now runs on every push, every
    # tag and every weekly schedule, and reports its own verdict.
    runs-on: windows-latest   # fixture proven on Windows; ubuntu parity TBD
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Round-3 B3: this job IS the committed proof host (win32/x64/
      # node 26.3.0/npm 11.16.0 + the nodeExecSha256 exec-bytes pin, independent-audit
      # F2, per the proof file's proofHost block — setup-node installs the
      # official nodejs.org binary whose bytes the digest was cut from).
      # EXACT pins — not "26": host-exactness is decided by the ACTUAL
      # runtime's bytes, so a drifted node/npm here (or a repackaged
      # runtime printing 26.3.0) makes `check` correctly report INCOMPLETE
      # (exit 2) and fail the job. If the pins move, the proof file's
      # proofHost/environment blocks must be re-cut on a machine that
      # genuinely runs the new versions.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26.3.0
      - run: npm install -g npm@11.16.0   # exact npm pin: the proof host identity includes npm
      - run: npm ci --no-audit --no-fund   # audit S3
      - run: npm run build
      # Audit F11 + round-3 B3: `check` re-asserts the committed expectation
      # against the just-run evidence WITHOUT a second full run. On this
      # pinned host EVERY assertion — including the normalized-hash pairs and
      # the evidence-environment binding — is evaluated; a SKIPPED host-exact
      # assertion (or a divergence) exits non-zero and fails the job. On any
      # other machine `check` reports INCOMPLETE (exit 2) by design.
      - name: amabie run (execute the axios 0.27.2 -> 1.0.0 experiment)
        run: node apps/cli/dist/src/main.js run fixtures/axios-0.27-to-1.0/specs/axios-mock-adapter.json
        shell: bash
      - name: amabie check (assert the committed proof, not just the exit code)
        run: node apps/cli/dist/src/main.js check fixtures/axios-0.27-to-1.0/specs/axios-mock-adapter.json
        shell: bash
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-bundle
          path: .amabie-runs/**/artifacts/
